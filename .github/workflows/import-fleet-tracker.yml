name: Import Fleet Tracker Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ !contains(github.event.head_commit.message, 'import fleet tracker source') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore uploaded source
        env:
          PAYLOAD: ""
        run: |
          mkdir -p fleet_tracker
          printf '%s' "$PAYLOAD" | base64 -d | gzip -d > fleet_tracker/bussssss.py

      - name: Commit fleet tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fleet_tracker/bussssss.py
          git diff --cached --quiet && exit 0
          git commit -m "import fleet tracker source"
          git push
